# CodeQL for Kotlin needs the code built: the default setup's "none" build mode cannot read Kotlin
# ("No Java/Kotlin code found"). This advanced setup builds with Gradle. It works only once the
# repository's CodeQL default setup is turned off (Settings → Code security → CodeQL analysis).
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: ./gradlew --no-build-cache :android:assembleDebug :core:compileKotlinDesktop :data:compileKotlinDesktop

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
